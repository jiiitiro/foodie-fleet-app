# Production: no defaults, so startup fails fast if anything is missing.
# Required env vars: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD,
#                    APP_BASE_URL, MAIL_USERNAME, MAIL_PASSWORD
spring.jpa.show-sql=false

# Running behind a TLS-terminating reverse proxy
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.error.include-stacktrace=never
