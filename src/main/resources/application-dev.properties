# Local development defaults (IntelliJ / ./mvnw spring-boot:run against Docker Postgres on 5433).
# Inside Docker Compose, the SPRING_DATASOURCE_* env vars override these values.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/${POSTGRES_DB:foodiefleet_db}}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.base-url=${APP_BASE_URL:http://localhost:8080}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
