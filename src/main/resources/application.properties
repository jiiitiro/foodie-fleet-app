spring.application.name=app
# Profile used when SPRING_PROFILES_ACTIVE is not set (local development)
spring.profiles.default=dev

# Server Configuration
server.port=8080

# Database: connection settings come from the active profile or SPRING_DATASOURCE_* env vars
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate: the schema is owned by Flyway (src/main/resources/db/migration)
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# App & Third-Party Service Configurations
resend.api.key=${RESEND_API_KEY:}
app.base-url=${APP_BASE_URL}

# Spring Mail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
