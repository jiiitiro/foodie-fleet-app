spring.application.name=app

# Server Configuration
server.port=8080

# Spring will automatically fallback to localhost:5433 when running in IntelliJ
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/foodiefleet_db}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# App & Third-Party Service Configurations
resend.api.key=${RESEND_API_KEY}
app.base-url=${APP_BASE_URL}

# Spring Mail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true