<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>FoodieFleet - Login</title>
</head>
<body>
<h2>Login to FoodieFleet</h2>
<div th:if="${param.error}" style="color:red;">Invalid email or password.</div>
<div th:if="${param.logout}" style="color:green;">You have been logged out.</div>
<div th:if="${param.registered}" style="color:green;">Registration successful! Please login.</div>

<form th:action="@{/auth/login}" method="post">
    <label>Email: <input type="email" name="username" required /></label><br/><br/>
    <label>Password: <input type="password" name="password" required /></label><br/><br/>
    <button type="submit">Log In</button>
</form>
<p>Don't have an account? <a th:href="@{/auth/register}">Register here</a></p>
</body>
</html>
