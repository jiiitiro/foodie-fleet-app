<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/app}">
<head>
    <title>Restaurants</title>
</head>
<body>
<main layout:fragment="content">
    <!-- Search hero -->
    <section class="relative overflow-hidden border-b border-stone-200 bg-white">
        <div class="pointer-events-none absolute -top-24 right-0 -z-0 size-96 rounded-full bg-gradient-to-br from-brand-200/50 to-amber-100/40 blur-3xl"></div>
        <div class="relative mx-auto max-w-6xl px-4 py-10 sm:px-6 sm:py-14">
            <h1 class="text-3xl font-extrabold tracking-tight text-stone-900 sm:text-4xl">What are you craving?</h1>
            <p class="mt-2 text-stone-600">Order from restaurants that are open right now.</p>
            <form th:action="@{/customer/home}" method="get" class="mt-6 flex max-w-xl gap-2" role="search">
                <label for="q" class="sr-only">Search restaurants</label>
                <div class="relative flex-1">
                    <span class="pointer-events-none absolute inset-y-0 left-3.5 grid place-items-center text-stone-400">
                        <svg th:replace="~{fragments/icons :: search('size-5')}"></svg>
                    </span>
                    <input id="q" name="q" type="search" th:value="${query}" class="input py-3 pl-11" placeholder="Search restaurants by name" />
                </div>
                <button type="submit" class="btn btn-primary px-5">Search</button>
            </form>
        </div>
    </section>

    <section class="mx-auto max-w-6xl px-4 py-8 sm:px-6">
        <div th:replace="~{fragments/alerts :: flash}"></div>

        <div class="mb-4 flex items-center justify-between">
            <h2 class="text-lg font-bold text-stone-900">
                <th:block th:if="${#strings.isEmpty(query)}">Open now</th:block>
                <th:block th:unless="${#strings.isEmpty(query)}">Results for "<span th:text="${query}">query</span>"</th:block>
                <span class="ml-1 text-sm font-medium text-stone-500" th:text="'(' + ${#lists.size(restaurants)} + ')'">(0)</span>
            </h2>
            <a th:unless="${#strings.isEmpty(query)}" th:href="@{/customer/home}" class="btn btn-ghost btn-sm">Clear search</a>
        </div>

        <div th:if="${#lists.isEmpty(restaurants)}" class="card card-body flex flex-col items-center py-14 text-center">
            <span class="grid size-12 place-items-center rounded-full bg-stone-100 text-stone-400"><svg th:replace="~{fragments/icons :: store('size-6')}"></svg></span>
            <p class="mt-3 font-semibold text-stone-900">No open restaurants found</p>
            <p class="text-sm text-stone-500">Try another search, or check back a little later.</p>
        </div>

        <div th:unless="${#lists.isEmpty(restaurants)}" class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
            <a th:each="restaurant : ${restaurants}" th:href="@{/customer/restaurants/{id}(id=${restaurant.id})}"
               class="card group flex flex-col overflow-hidden transition hover:-translate-y-0.5 hover:shadow-md">
                <div class="relative grid aspect-[16/7] place-items-center bg-gradient-to-br from-brand-400 to-brand-600 text-white">
                    <svg th:replace="~{fragments/icons :: store('size-10 opacity-90')}"></svg>
                    <span class="badge absolute right-3 top-3 bg-white/90 text-emerald-700"><span class="size-1.5 rounded-full bg-emerald-500"></span>Open</span>
                </div>
                <div class="flex flex-1 flex-col p-5">
                    <h3 class="text-lg font-bold text-stone-900 group-hover:text-brand-700" th:text="${restaurant.name}">Restaurant</h3>
                    <p class="mt-1 flex-1 text-sm text-stone-500" th:text="${restaurant.description}">Description</p>
                    <p class="mt-3 flex items-center gap-1.5 text-xs text-stone-500">
                        <svg th:replace="~{fragments/icons :: map-pin('size-3.5')}"></svg>
                        <span th:text="${restaurant.address}">Address</span>
                    </p>
                </div>
            </a>
        </div>
    </section>
</main>
</body>
</html>
