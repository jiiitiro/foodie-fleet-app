<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title layout:title-pattern="$CONTENT_TITLE · FoodieFleet">FoodieFleet</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="flex min-h-full flex-col bg-stone-50 font-sans text-stone-800 antialiased">

<header class="sticky top-0 z-30 border-b border-stone-200/80 bg-white/85 backdrop-blur">
    <nav class="mx-auto flex h-16 max-w-6xl items-center justify-between gap-4 px-4 sm:px-6">
        <a th:href="@{/}" class="flex items-center gap-2.5 font-extrabold tracking-tight text-stone-900">
            <svg th:replace="~{fragments/icons :: logo('size-8')}"></svg>
            <span class="text-lg">Foodie<span class="text-brand-600">Fleet</span></span>
        </a>

        <div class="flex items-center gap-2">
            <th:block sec:authorize="isAuthenticated()">
                <a th:href="@{/auth/default-redirect}" class="btn btn-ghost hidden sm:inline-flex">Dashboard</a>
                <span class="hidden items-center gap-2 rounded-full bg-stone-100 py-1 pl-1 pr-3 text-sm text-stone-600 md:flex">
                    <span class="grid size-7 place-items-center rounded-full bg-brand-100 text-brand-700">
                        <svg th:replace="~{fragments/icons :: user('size-4')}"></svg>
                    </span>
                    <span sec:authentication="name">user@example.com</span>
                </span>
                <form th:action="@{/auth/logout}" method="post">
                    <button type="submit" class="btn btn-secondary" title="Log out">
                        <svg th:replace="~{fragments/icons :: logout('size-4')}"></svg>
                        <span class="hidden sm:inline">Log out</span>
                    </button>
                </form>
            </th:block>
            <th:block sec:authorize="!isAuthenticated()">
                <a th:href="@{/auth/login}" class="btn btn-ghost">Log in</a>
                <a th:href="@{/auth/register}" class="btn btn-primary">Get started</a>
            </th:block>
        </div>
    </nav>
</header>

<main class="flex-1" layout:fragment="content">
    Page content
</main>

<footer class="border-t border-stone-200 bg-white">
    <div class="mx-auto flex max-w-6xl flex-col items-center justify-between gap-2 px-4 py-6 text-sm text-stone-500 sm:flex-row sm:px-6">
        <p class="flex items-center gap-2">
            <svg th:replace="~{fragments/icons :: logo('size-5')}"></svg>
            <span>FoodieFleet: good food, delivered fast.</span>
        </p>
        <p th:text="'© ' + ${#temporals.year(#temporals.createNow())} + ' FoodieFleet'">© FoodieFleet</p>
    </div>
</footer>
</body>
</html>
