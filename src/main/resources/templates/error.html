<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>FoodieFleet - Error</title>
</head>
<body>
<h2 th:text="${status != null} ? ${status + ' - ' + error} : 'Something went wrong'">Error</h2>
<p th:text="${#strings.isEmpty(message)} ? 'An unexpected error occurred.' : ${message}"></p>
<p><a th:href="@{/auth/default-redirect}">Back to your dashboard</a></p>
</body>
</html>
