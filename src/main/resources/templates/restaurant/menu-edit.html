<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>FoodieFleet - Edit Menu Item</title>
</head>
<body>
<h2>Edit Menu Item</h2>

<form th:action="@{/restaurant/menu/edit/{id}(id=${itemId})}" th:object="${menuItemRequest}" method="post">
    <label>Name: <input type="text" th:field="*{name}" required maxlength="255" /></label>
    <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color:red;"></span><br/><br/>
    <label>Description: <input type="text" th:field="*{description}" maxlength="255" /></label>
    <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}" style="color:red;"></span><br/><br/>
    <label>Price: <input type="number" th:field="*{price}" required min="0.01" step="0.01" /></label>
    <span th:if="${#fields.hasErrors('price')}" th:errors="*{price}" style="color:red;"></span><br/><br/>
    <label>Image URL: <input type="url" th:field="*{imageUrl}" maxlength="255" /></label>
    <span th:if="${#fields.hasErrors('imageUrl')}" th:errors="*{imageUrl}" style="color:red;"></span><br/><br/>
    <label><input type="checkbox" th:field="*{available}" /> Available</label><br/><br/>
    <button type="submit">Save</button>
    <a th:href="@{/restaurant/dashboard}">Cancel</a>
</form>
</body>
</html>
