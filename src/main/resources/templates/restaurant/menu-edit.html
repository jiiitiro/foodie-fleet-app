<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/app}">
<head>
    <title>Edit menu item</title>
</head>
<body>
<main layout:fragment="content" class="mx-auto max-w-2xl px-4 py-10 sm:px-6">
    <a th:href="@{/restaurant/dashboard#menu}" class="btn btn-ghost -ml-3 mb-4">
        <svg th:replace="~{fragments/icons :: arrow-left('size-4')}"></svg> Back to dashboard
    </a>
    <h1 class="text-2xl font-extrabold tracking-tight text-stone-900">Edit menu item</h1>

    <form th:action="@{/restaurant/menu/edit/{id}(id=${itemId})}" th:object="${menuItemRequest}" method="post" class="card card-body mt-6 space-y-5">
        <div class="grid gap-5 sm:grid-cols-3">
            <div class="sm:col-span-2">
                <label for="name" class="label">Name</label>
                <input type="text" th:field="*{name}" class="input" th:classappend="${#fields.hasErrors('name')} ? 'input-error'" required maxlength="255" />
                <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="field-error"></p>
            </div>
            <div>
                <label for="price" class="label">Price</label>
                <input type="number" th:field="*{price}" class="input" th:classappend="${#fields.hasErrors('price')} ? 'input-error'" required min="0.01" step="0.01" />
                <p th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="field-error"></p>
            </div>
        </div>
        <div>
            <label for="description" class="label">Description</label>
            <input type="text" th:field="*{description}" class="input" th:classappend="${#fields.hasErrors('description')} ? 'input-error'" maxlength="255" />
            <p th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="field-error"></p>
        </div>
        <div>
            <label for="imageUrl" class="label">Image URL</label>
            <input type="url" th:field="*{imageUrl}" class="input" th:classappend="${#fields.hasErrors('imageUrl')} ? 'input-error'" placeholder="https://…" maxlength="255" />
            <p th:if="${#fields.hasErrors('imageUrl')}" th:errors="*{imageUrl}" class="field-error"></p>
        </div>
        <label class="flex items-center gap-3 text-sm font-medium text-stone-700">
            <input type="checkbox" th:field="*{available}" class="checkbox" /> Available to order
        </label>
        <div class="flex flex-col-reverse gap-3 pt-2 sm:flex-row sm:justify-end">
            <a th:href="@{/restaurant/dashboard#menu}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Save changes</button>
        </div>
    </form>
</main>
</body>
</html>
